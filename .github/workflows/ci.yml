name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      patch-artifact:
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - if: inputs.patch-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.patch-artifact }}
          path: ${{ runner.temp }}/agent
      - if: inputs.patch-artifact != ''
        run: git apply "$RUNNER_TEMP/agent/tests.patch"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.app }}
      - run: npm run typecheck
        working-directory: ${{ matrix.app }}
      - if: matrix.app == 'frontend'
        run: npm run format:check
        working-directory: ${{ matrix.app }}
      - run: npm run test:coverage
        working-directory: ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.app }}
          path: ${{ matrix.app }}/coverage/coverage-summary.json
  agent-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - if: inputs.patch-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.patch-artifact }}
          path: ${{ runner.temp }}/agent
      - if: inputs.patch-artifact != ''
        run: git apply "$RUNNER_TEMP/agent/tests.patch"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: agents/agent-pr-tests/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps
        working-directory: agents/agent-pr-tests
      - run: npm run typecheck
        working-directory: agents/agent-pr-tests
      - run: npm test
        working-directory: agents/agent-pr-tests
